<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Color Quiz</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="auth-card">

        <div class="auth-icon">
            🔐
        </div>

        <h1>Welcome Back!</h1>

        <p>Login to start your quiz</p>


        {% with messages = get_flashed_messages(
            with_categories=true
        ) %}

            {% for category, message in messages %}

                <div class="flash {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form method="POST">

            <input
                type="email"
                name="email"
                class="auth-input"
                placeholder="📧 Email Address"
                required
            >


            <input
                type="password"
                name="password"
                class="auth-input"
                placeholder="🔑 Password"
                required
            >


            <button
                type="submit"
                class="auth-btn">

                Login 🚀

            </button>

        </form>


        <p class="auth-bottom">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>


        <a href="{{ url_for('index') }}"
           class="back-link">

            ← Back Home

        </a>

    </div>

</div>

</body>

</html>
