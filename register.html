<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Color Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="auth-card">
        <div class="auth-icon">🎓</div>
        <h1>Create Account</h1>
        <p>Join Color Quiz today!</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <input type="text" name="name" class="auth-input" placeholder="👤 Full Name" maxlength="50" required>
            <input type="email" name="email" class="auth-input" placeholder="📧 Email Address" required>
            <input type="password" name="password" class="auth-input" placeholder="🔑 Password (6+ characters)" minlength="6" required>
            <input type="password" name="confirm_password" class="auth-input" placeholder="🔑 Confirm Password" minlength="6" required>
            <button type="submit" class="auth-btn">Create Account ✨</button>
        </form>

        <p class="auth-bottom">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        <a href="{{ url_for('index') }}" class="back-link">← Back Home</a>
    </div>
</div>
</body>
</html>
